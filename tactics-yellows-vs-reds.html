<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yellows vs Reds</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 12px;
    color: #fff;
  }
  h1 { font-size: 1.1rem; font-weight: 700; }
  p.sub { font-size: 0.78rem; color: #aaa; text-align: center; max-width: 480px; line-height: 1.5; }
  canvas { display: block; border-radius: 6px; max-width: 100%; }
  .key {
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    font-size: 0.72rem; color: #ccc;
  }
  .key-item { display: flex; align-items: center; gap: 6px; }
  .k-dot { width: 13px; height: 13px; border-radius: 50%; }
  .k-line { width: 28px; height: 0; border-top: 2px dashed; }
</style>
</head>
<body>

<h1>Yellows vs Reds</h1>
<p class="sub">They'll go long — so get tight, win the header and be first to the second ball. Don't give them space to run into.</p>

<canvas id="c" width="480" height="660"></canvas>

<div class="key">
  <div class="key-item"><div class="k-dot" style="background:#f5d020"></div> Us (Yellows)</div>
  <div class="key-item"><div class="k-dot" style="background:#e03030"></div> Them (Reds)</div>
  <div class="key-item"><div class="k-line" style="border-color:#f5d020"></div> Our movement</div>
  <div class="key-item"><div class="k-line" style="border-color:#e03030bb"></div> Their ball</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 660;
const L = 28, R = W-28, T = 20, B = H-20;
const PW = R-L, PH = B-T;
const MX = W/2, MY = (T+B)/2;

function drawPitch() {
  const sh = PH/8;
  for (let i=0;i<8;i++) {
    ctx.fillStyle = i%2===0 ? '#2d7a3a' : '#2a7237';
    ctx.fillRect(L, T+i*sh, PW, sh);
  }
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.5;
  ctx.strokeRect(L,T,PW,PH);
  ctx.beginPath(); ctx.moveTo(L,MY); ctx.lineTo(R,MY); ctx.stroke();
  ctx.beginPath(); ctx.arc(MX,MY,55,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(MX,MY,3,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fill();

  const paW=200, paH=95, paX=(W-paW)/2;
  ctx.strokeRect(paX,T,paW,paH);
  ctx.strokeRect(paX,B-paH,paW,paH);

  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3;
  const gW=88,gD=13,gX=(W-gW)/2;
  ctx.strokeRect(gX,T-gD,gW,gD);
  ctx.strokeRect(gX,B,gW,gD);

  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(MX,T+72,3,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(MX,B-72,3,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.font='bold 8px Arial'; ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.textAlign='center'; ctx.fillText('YOUR ATTACK ↓', MX, T+12);
  ctx.restore();
}

function arrow(x1,y1,x2,y2,col,alpha=1) {
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<2)return;
  const ux=dx/len,uy=dy/len;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.setLineDash([6,5]);
  ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]);
  const hs=10;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-ux*hs-uy*hs*0.5, y2-uy*hs+ux*hs*0.5);
  ctx.lineTo(x2-ux*hs+uy*hs*0.5, y2-uy*hs-ux*hs*0.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function player(x,y,label,home) {
  const col = home ? '#f5d020' : '#e03030';
  const tc  = home ? '#111' : '#fff';
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2);
  ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=tc;
  const fs = label.length>2 ? 8 : 9.5;
  ctx.font=`bold ${fs}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,x,y);
  ctx.restore();
}

const px = x => L + x*PW;
const py = y => T + y*PH;

function draw() {
  ctx.clearRect(0,0,W,H);
  drawPitch();

  // ── Reds — long ball merchants, two big FWs up top ──
  player(px(0.5),  py(0.05), 'GK', false);
  player(px(0.28), py(0.18), 'CB', false);
  player(px(0.72), py(0.18), 'CB', false);
  player(px(0.3),  py(0.32), 'CM', false);
  player(px(0.7),  py(0.32), 'CM', false);
  player(px(0.35), py(0.44), 'FW', false);
  player(px(0.65), py(0.44), 'FW', false);

  // Long ball from their GK/CB
  arrow(px(0.5), py(0.05), px(0.5), py(0.50), '#e03030', 0.7);

  // ── Us — 3-3-1 ──
  player(px(0.5),  py(0.95), 'GK', true);
  // 3 CBs tight and high
  player(px(0.22), py(0.78), 'CB', true);
  player(px(0.5),  py(0.75), 'CB', true);  // centre CB steps to meet ball
  player(px(0.78), py(0.78), 'CB', true);
  // 3 midfielders — compact, ready for second ball
  player(px(0.18), py(0.62), 'LM', true);
  player(px(0.5),  py(0.60), 'CM', true);
  player(px(0.82), py(0.62), 'RM', true);
  // Single striker
  player(px(0.5),  py(0.46), 'ST', true);

  // Centre CB steps up to head it clear
  arrow(px(0.5), py(0.75), px(0.5), py(0.60), '#f5d020', 0.9);

  // Midfielders tuck in to win second ball
  arrow(px(0.18), py(0.62), px(0.32), py(0.58), '#f5d020', 0.75);
  arrow(px(0.82), py(0.62), px(0.68), py(0.58), '#f5d020', 0.75);

  // ST presses their CB when we win it — quick transition
  arrow(px(0.5), py(0.46), px(0.5), py(0.36), '#f5d020', 0.8);
}

draw();
</script>
</body>
</html>
